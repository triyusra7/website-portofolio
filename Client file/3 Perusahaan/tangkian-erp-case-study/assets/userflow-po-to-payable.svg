<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 620" width="1720" height="620" role="img" aria-label="User flow — purchase order to payable">
<title>User flow — purchase order to payable</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A8AA0"/>
  </marker>
  <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#E8A020"/>
  </marker>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E3F5C" flood-opacity="0.10"/>
  </filter>
</defs>
<style>
  .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
  .h1 { font-size: 26px; font-weight: 700; fill: #2D3748; }
  .sub { font-size: 14px; fill: #7A8AA0; }
  .lbl { font-size: 13px; fill: #2D3748; }
  .lblb { font-size: 13.5px; font-weight: 700; fill: #2D3748; }
  .w { font-size: 13.5px; font-weight: 700; fill: #FFFFFF; }
  .ws { font-size: 11.5px; fill: #C8D8E8; }
  .cap { font-size: 11px; font-weight: 700; letter-spacing: 1.1px; fill: #7A8AA0; }
  .note { font-size: 12px; fill: #7A8AA0; }
  .edge { stroke: #CBD8E6; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
  .edgeA { stroke: #E8A020; stroke-width: 2; fill: none; marker-end: url(#arrowAmber); }
  .edgeD { stroke: #CBD8E6; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
</style>
<rect width="1720" height="620" fill="#F7F9FC"/>
<text class="t h1" x="56" y="64">User flow 2 — Purchase order → goods receipt → payable</text><text class="t sub" x="56" y="88">Three documents, three automatic journals, one payable balance that always ties back to the ledger.</text><rect x="56" y="118" width="1608" height="150" rx="14" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5"/><text class="t cap" x="76" y="140">STAFF PEMBELIAN</text><rect x="88" y="150" width="340" height="84" rx="10" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5" filter="url(#soft)"/><text class="t lblb" x="258.0" y="188.0" text-anchor="middle" style="fill:#2D3748">Buat Purchase Order</text><text class="t note" x="258.0" y="206.0" text-anchor="middle" style="fill:#7A8AA0">supplier, item, qty, harga</text><path class="edge" d="M428 192 H460"/><rect x="460" y="150" width="340" height="84" rx="10" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5" filter="url(#soft)"/><text class="t lblb" x="630.0" y="188.0" text-anchor="middle" style="fill:#2D3748">Terima barang (Penerimaan Barang)</text><text class="t note" x="630.0" y="206.0" text-anchor="middle" style="fill:#7A8AA0">qty diterima → kartu stok</text><path class="edge" d="M800 192 H832"/><rect x="832" y="150" width="340" height="84" rx="10" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5" filter="url(#soft)"/><text class="t lblb" x="1002.0" y="188.0" text-anchor="middle" style="fill:#2D3748">Catat tagihan vendor</text><text class="t note" x="1002.0" y="206.0" text-anchor="middle" style="fill:#7A8AA0">jatuh tempo &amp; termin</text><path class="edge" d="M1172 192 H1204"/><rect x="1204" y="150" width="340" height="84" rx="10" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5" filter="url(#soft)"/><text class="t lblb" x="1374.0" y="188.0" text-anchor="middle" style="fill:#2D3748">Bayar hutang</text><text class="t note" x="1374.0" y="206.0" text-anchor="middle" style="fill:#7A8AA0">pilih akun kas / bank</text><rect x="56" y="288" width="1608" height="150" rx="14" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5"/><text class="t cap" x="76" y="310">JURNAL OTOMATIS</text><rect x="88" y="320" width="340" height="84" rx="10" fill="#EEF4FA" stroke="#264C70" stroke-width="1.5"/><text class="t lblb" x="104" y="344" style="fill:#264C70">PO diposting</text><text class="t note" x="104" y="366" font-family="ui-monospace, Menlo, Consolas, monospace">Dr Pembelian Dlm Perjalanan</text><text class="t note" x="104" y="383" font-family="ui-monospace, Menlo, Consolas, monospace">Cr Hutang Usaha</text><path class="edgeA" d="M258 234 V316"/><rect x="460" y="320" width="340" height="84" rx="10" fill="#EEF4FA" stroke="#264C70" stroke-width="1.5"/><text class="t lblb" x="476" y="344" style="fill:#264C70">Barang diterima</text><text class="t note" x="476" y="366" font-family="ui-monospace, Menlo, Consolas, monospace">Dr Persediaan</text><text class="t note" x="476" y="383" font-family="ui-monospace, Menlo, Consolas, monospace">Cr Pembelian Dlm Perjalanan</text><path class="edgeA" d="M630 234 V316"/><rect x="832" y="320" width="340" height="84" rx="10" fill="#EEF4FA" stroke="#264C70" stroke-width="1.5"/><text class="t lblb" x="848" y="344" style="fill:#264C70">Tagihan final</text><text class="t note" x="848" y="366" font-family="ui-monospace, Menlo, Consolas, monospace">Dr Persediaan / Beban</text><text class="t note" x="848" y="383" font-family="ui-monospace, Menlo, Consolas, monospace">Cr Hutang Usaha</text><path class="edgeA" d="M1002 234 V316"/><rect x="1204" y="320" width="340" height="84" rx="10" fill="#EEF4FA" stroke="#264C70" stroke-width="1.5"/><text class="t lblb" x="1220" y="344" style="fill:#264C70">Pembayaran</text><text class="t note" x="1220" y="366" font-family="ui-monospace, Menlo, Consolas, monospace">Dr Hutang Usaha</text><text class="t note" x="1220" y="383" font-family="ui-monospace, Menlo, Consolas, monospace">Cr Kas / Bank</text><path class="edgeA" d="M1374 234 V316"/><rect x="88" y="500" width="508" height="62" rx="10" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5" filter="url(#soft)"/><text class="t lblb" x="342.0" y="536.0" text-anchor="middle" style="fill:#2D3748">Hutang Dagang / Hutang Usaha</text><rect x="620" y="500" width="508" height="62" rx="10" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5" filter="url(#soft)"/><text class="t lblb" x="874.0" y="536.0" text-anchor="middle" style="fill:#2D3748">Kartu Stok &amp; nilai persediaan</text><rect x="1152" y="500" width="508" height="62" rx="10" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5" filter="url(#soft)"/><text class="t lblb" x="1406.0" y="536.0" text-anchor="middle" style="fill:#2D3748">Neraca · Laba Rugi · Arus Kas</text><path class="edgeA" d="M860 404 V496"/></svg>