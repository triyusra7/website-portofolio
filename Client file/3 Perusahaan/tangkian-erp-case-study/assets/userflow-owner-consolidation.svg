<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 620" width="1720" height="620" role="img" aria-label="User flow — owner reviewing group performance">
<title>User flow — owner reviewing group performance</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A8AA0"/>
  </marker>
  <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#E8A020"/>
  </marker>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E3F5C" flood-opacity="0.10"/>
  </filter>
</defs>
<style>
  .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
  .h1 { font-size: 26px; font-weight: 700; fill: #2D3748; }
  .sub { font-size: 14px; fill: #7A8AA0; }
  .lbl { font-size: 13px; fill: #2D3748; }
  .lblb { font-size: 13.5px; font-weight: 700; fill: #2D3748; }
  .w { font-size: 13.5px; font-weight: 700; fill: #FFFFFF; }
  .ws { font-size: 11.5px; fill: #C8D8E8; }
  .cap { font-size: 11px; font-weight: 700; letter-spacing: 1.1px; fill: #7A8AA0; }
  .note { font-size: 12px; fill: #7A8AA0; }
  .edge { stroke: #CBD8E6; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
  .edgeA { stroke: #E8A020; stroke-width: 2; fill: none; marker-end: url(#arrowAmber); }
  .edgeD { stroke: #CBD8E6; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
</style>
<rect width="1720" height="620" fill="#F7F9FC"/>
<text class="t h1" x="56" y="64">User flow 3 — Owner reviews group performance</text><text class="t sub" x="56" y="88">What used to be a spreadsheet assembled by hand at month end is now four clicks.</text><rect x="88" y="170" width="284" height="94" rx="10" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5" filter="url(#soft)"/><text class="t lblb" x="230" y="210" text-anchor="middle" style="fill:#2D3748">Login sebagai owner</text><text class="t note" x="230" y="232" text-anchor="middle" style="fill:#7A8AA0">akses penuh ke tiga entitas</text><path class="edge" d="M372 217 H396"/><rect x="396" y="170" width="284" height="94" rx="10" fill="#264C70" stroke="#264C70" stroke-width="1.5" filter="url(#soft)"/><text class="t lblb" x="538" y="210" text-anchor="middle" style="fill:#FFFFFF">Buka Laporan Konsolidasi</text><text class="t note" x="538" y="232" text-anchor="middle" style="fill:#C8D8E8">pilih bulan &amp; tahun</text><path class="edge" d="M680 217 H704"/><rect x="704" y="170" width="284" height="94" rx="10" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5" filter="url(#soft)"/><text class="t lblb" x="846" y="210" text-anchor="middle" style="fill:#2D3748">Baca tiga tab</text><text class="t note" x="846" y="232" text-anchor="middle" style="fill:#7A8AA0">Laba Rugi · Neraca · Ringkasan Entitas</text><path class="edge" d="M988 217 H1012"/><rect x="1012" y="170" width="284" height="94" rx="10" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5" filter="url(#soft)"/><text class="t lblb" x="1154" y="210" text-anchor="middle" style="fill:#2D3748">Buka Key Stats per entitas</text><text class="t note" x="1154" y="232" text-anchor="middle" style="fill:#7A8AA0">ROE · ROA · ROIC · margin · growth</text><path class="edge" d="M1296 217 H1320"/><rect x="1320" y="170" width="284" height="94" rx="10" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5" filter="url(#soft)"/><text class="t lblb" x="1462" y="210" text-anchor="middle" style="fill:#2D3748">Cetak / Export Excel</text><text class="t note" x="1462" y="232" text-anchor="middle" style="fill:#7A8AA0">untuk bank, pajak, rapat</text><text class="t cap" x="56" y="330">DIBACA LANGSUNG DARI JURNAL TIAP ENTITAS — TIDAK ADA INPUT ULANG</text><rect x="56" y="346" width="520" height="70" rx="12" fill="#FFFFFF" stroke="#264C70" stroke-width="2"/><text class="t lblb" x="80" y="378" style="fill:#264C70">PT. Tangkian Lintas Anugerah</text><text class="t note" x="80" y="398">jurnal · buku besar · saldo akun</text><path class="edgeA" d="M316 416 V458"/><rect x="600" y="346" width="520" height="70" rx="12" fill="#FFFFFF" stroke="#38A169" stroke-width="2"/><text class="t lblb" x="624" y="378" style="fill:#38A169">PT. Tangkian Samudera Logistik</text><text class="t note" x="624" y="398">jurnal · buku besar · saldo akun</text><path class="edgeA" d="M860 416 V458"/><rect x="1144" y="346" width="520" height="70" rx="12" fill="#FFFFFF" stroke="#E8A020" stroke-width="2"/><text class="t lblb" x="1168" y="378" style="fill:#E8A020">Arobi</text><text class="t note" x="1168" y="398">jurnal · buku besar · saldo akun</text><path class="edgeA" d="M1404 416 V458"/><rect x="56" y="462" width="1608" height="90" rx="14" fill="#1E3F5C"/><text class="t w" x="84" y="500" font-size="16">Laporan Konsolidasi + Key Stats</text><text class="t ws" x="84" y="524">Pendapatan, laba bersih, total aset, ekuitas, kontribusi tiap entitas, dan rasio — dalam satu layar, kapan saja.</text></svg>