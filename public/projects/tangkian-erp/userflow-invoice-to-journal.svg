<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 760" width="1720" height="760" role="img" aria-label="User flow — sales invoice to automatic journal">
<title>User flow — sales invoice to automatic journal</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A8AA0"/>
  </marker>
  <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#E8A020"/>
  </marker>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E3F5C" flood-opacity="0.10"/>
  </filter>
</defs>
<style>
  .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
  .h1 { font-size: 26px; font-weight: 700; fill: #2D3748; }
  .sub { font-size: 14px; fill: #7A8AA0; }
  .lbl { font-size: 13px; fill: #2D3748; }
  .lblb { font-size: 13.5px; font-weight: 700; fill: #2D3748; }
  .w { font-size: 13.5px; font-weight: 700; fill: #FFFFFF; }
  .ws { font-size: 11.5px; fill: #C8D8E8; }
  .cap { font-size: 11px; font-weight: 700; letter-spacing: 1.1px; fill: #7A8AA0; }
  .note { font-size: 12px; fill: #7A8AA0; }
  .edge { stroke: #CBD8E6; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
  .edgeA { stroke: #E8A020; stroke-width: 2; fill: none; marker-end: url(#arrowAmber); }
  .edgeD { stroke: #CBD8E6; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
</style>
<rect width="1720" height="760" fill="#F7F9FC"/>
<text class="t h1" x="56" y="64">User flow 1 — Sales invoice → automatic journal</text><text class="t sub" x="56" y="88">The staff member never opens the journal screen. Posting the document is what writes the double entry.</text><rect x="56" y="118" width="1608" height="176" rx="14" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5"/><text class="t cap" x="76" y="140">STAFF PENJUALAN</text><rect x="56" y="326" width="1608" height="176" rx="14" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5"/><text class="t cap" x="76" y="348">SISTEM (OTOMATIS)</text><rect x="56" y="558" width="1608" height="130" rx="14" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5"/><text class="t cap" x="76" y="580">LAPORAN</text><rect x="88" y="168" width="250" height="88" rx="10" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5" filter="url(#soft)"/><text class="t lblb" x="213" y="202" text-anchor="middle" style="fill:#2D3748">Pilih customer</text><text class="t note" x="213" y="222" text-anchor="middle" style="fill:#7A8AA0">Limit kredit &amp;</text><text class="t note" x="213" y="237" text-anchor="middle" style="fill:#7A8AA0">sisa limit tampil</text><path class="edge" d="M338 212 H374"/><rect x="374" y="168" width="250" height="88" rx="10" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5" filter="url(#soft)"/><text class="t lblb" x="499" y="202" text-anchor="middle" style="fill:#2D3748">Isi item &amp; qty</text><text class="t note" x="499" y="222" text-anchor="middle" style="fill:#7A8AA0">Harga incl. PPN,</text><text class="t note" x="499" y="237" text-anchor="middle" style="fill:#7A8AA0">DPP dihitung mundur</text><path class="edge" d="M624 212 H660"/><rect x="660" y="168" width="250" height="88" rx="10" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5" filter="url(#soft)"/><text class="t lblb" x="785" y="202" text-anchor="middle" style="fill:#2D3748">Cek total</text><text class="t note" x="785" y="222" text-anchor="middle" style="fill:#7A8AA0">DPP · PPN · Grand total</text><path class="edge" d="M910 212 H946"/><rect x="946" y="168" width="250" height="88" rx="10" fill="#E8A020" stroke="#E8A020" stroke-width="1.5" filter="url(#soft)"/><text class="t lblb" x="1071" y="202" text-anchor="middle" style="fill:#1E3F5C">Post Invoice</text><text class="t note" x="1071" y="222" text-anchor="middle" style="fill:#7A4A00">Satu klik</text><path class="edgeA" d="M1163 256 V376"/><text class="t note" x="1176" y="286">otomatis, tanpa input manual</text><rect x="88" y="376" width="612" height="128" rx="10" fill="#EEF4FA" stroke="#264C70" stroke-width="1.5"/><text class="t lblb" x="108" y="404" style="fill:#264C70">Jurnal otomatis — JRN-INV-xxx (badge "Otomatis")</text><text class="t lbl" x="108" y="432" font-family="ui-monospace, Menlo, Consolas, monospace">Dr  Piutang Usaha (01-007)</text><text class="t lbl" x="680" y="432" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">Rp106.620.000</text><text class="t lbl" x="108" y="455" font-family="ui-monospace, Menlo, Consolas, monospace">Cr  Penjualan (04-001)</text><text class="t lbl" x="680" y="455" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">Rp96.054.054</text><text class="t lbl" x="108" y="478" font-family="ui-monospace, Menlo, Consolas, monospace">Cr  PPN Keluaran (02-003)</text><text class="t lbl" x="680" y="478" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">Rp10.565.946</text><rect x="740" y="390" width="290" height="74" rx="10" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5" filter="url(#soft)"/><text class="t lblb" x="885.0" y="423.0" text-anchor="middle" style="fill:#2D3748">Piutang Dagang</text><text class="t note" x="885.0" y="441.0" text-anchor="middle" style="fill:#7A8AA0">baris tagihan + aging</text><path class="edge" d="M700 427 H736" /><rect x="1046" y="390" width="290" height="74" rx="10" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5" filter="url(#soft)"/><text class="t lblb" x="1191.0" y="423.0" text-anchor="middle" style="fill:#2D3748">Kartu Stok</text><text class="t note" x="1191.0" y="441.0" text-anchor="middle" style="fill:#7A8AA0">stok keluar saat Surat Jalan</text><rect x="1352" y="390" width="290" height="74" rx="10" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5" filter="url(#soft)"/><text class="t lblb" x="1497.0" y="423.0" text-anchor="middle" style="fill:#2D3748">Buku Besar</text><text class="t note" x="1497.0" y="441.0" text-anchor="middle" style="fill:#7A8AA0">posting ke tiap akun</text><path class="edgeD" d="M1030 427 H1042"/><path class="edgeD" d="M1336 427 H1348"/><rect x="88" y="608" width="250" height="62" rx="10" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5" filter="url(#soft)"/><text class="t lblb" x="213.0" y="645" text-anchor="middle" style="fill:#2D3748">Laba Rugi</text><rect x="360" y="608" width="250" height="62" rx="10" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5" filter="url(#soft)"/><text class="t lblb" x="485.0" y="645" text-anchor="middle" style="fill:#2D3748">Neraca</text><rect x="632" y="608" width="250" height="62" rx="10" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5" filter="url(#soft)"/><text class="t lblb" x="757.0" y="645" text-anchor="middle" style="fill:#2D3748">Arus Kas</text><rect x="904" y="608" width="360" height="62" rx="10" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5" filter="url(#soft)"/><text class="t lblb" x="1084.0" y="645" text-anchor="middle" style="fill:#2D3748">Key Stats (ROE · ROA · margin)</text><rect x="1286" y="608" width="360" height="62" rx="10" fill="#1E3F5C" stroke="#1E3F5C" stroke-width="1.5" filter="url(#soft)"/><text class="t lblb" x="1466.0" y="645" text-anchor="middle" style="fill:#FFFFFF">Laporan Konsolidasi</text><path class="edgeA" d="M394 504 V604"/><text class="t note" x="406" y="548">semua laporan dihitung dari jurnal — bukan diketik ulang</text></svg>