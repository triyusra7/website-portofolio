<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 1300" width="1720" height="1300" role="img" aria-label="Information architecture — multi-entity accounting ERP">
<title>Information architecture — multi-entity accounting ERP</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A8AA0"/>
  </marker>
  <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#E8A020"/>
  </marker>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E3F5C" flood-opacity="0.10"/>
  </filter>
</defs>
<style>
  .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
  .h1 { font-size: 26px; font-weight: 700; fill: #2D3748; }
  .sub { font-size: 14px; fill: #7A8AA0; }
  .lbl { font-size: 13px; fill: #2D3748; }
  .lblb { font-size: 13.5px; font-weight: 700; fill: #2D3748; }
  .w { font-size: 13.5px; font-weight: 700; fill: #FFFFFF; }
  .ws { font-size: 11.5px; fill: #C8D8E8; }
  .cap { font-size: 11px; font-weight: 700; letter-spacing: 1.1px; fill: #7A8AA0; }
  .note { font-size: 12px; fill: #7A8AA0; }
  .edge { stroke: #CBD8E6; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
  .edgeA { stroke: #E8A020; stroke-width: 2; fill: none; marker-end: url(#arrowAmber); }
  .edgeD { stroke: #CBD8E6; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
</style>
<rect width="1720" height="1300" fill="#F7F9FC"/>
<text class="t h1" x="56" y="64">Information Architecture</text><text class="t sub" x="56" y="88">One login, three entity workspaces, one shared accounting core, one group-level consolidation layer.</text><text class="t cap" x="56" y="132">1 — ACCESS</text><rect x="56" y="148" width="300" height="64" rx="10" fill="#264C70" stroke="#264C70" stroke-width="1.5" filter="url(#soft)"/><text class="t lblb" x="206.0" y="176.0" text-anchor="middle" style="fill:#FFFFFF">Login</text><text class="t note" x="206.0" y="194.0" text-anchor="middle" style="fill:#C8D8E8">Username / e-mail + password</text><rect x="388" y="148" width="340" height="64" rx="10" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5" filter="url(#soft)"/><text class="t lblb" x="558.0" y="176.0" text-anchor="middle" style="fill:#2D3748">Role &amp; menu permissions</text><text class="t note" x="558.0" y="194.0" text-anchor="middle" style="fill:#7A8AA0">Admin · Manager · Staff — per menu, per entity</text><path class="edge" d="M356 180 H384"/><text class="t cap" x="56" y="266">2 — ENTITY SWITCHER (TOP BAR)</text><rect x="56" y="282" width="1608" height="58" rx="12" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5" filter="url(#soft)"/><rect x="72" y="296" width="300" height="30" rx="999" fill="#264C70"/><text class="t" x="222.0" y="315.5" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">PT. Tangkian Lintas Anugerah</text><rect x="388" y="296" width="300" height="30" rx="999" fill="#EDF2F7"/><text class="t" x="538.0" y="315.5" text-anchor="middle" fill="#2D3748" font-size="13" font-weight="700">PT. Tangkian Samudera Logistik</text><rect x="704" y="296" width="120" height="30" rx="999" fill="#EDF2F7"/><text class="t" x="764.0" y="315.5" text-anchor="middle" fill="#2D3748" font-size="13" font-weight="700">Arobi</text><text class="t note" x="856" y="316">Each entity keeps its own chart of accounts, master data, documents and journals in a separate store.</text><path class="edge" d="M206 212 V278"/><text class="t cap" x="56" y="382">3 — ENTITY WORKSPACE (MODULES DIFFER BY BUSINESS)</text><rect x="56" y="398" width="536" height="536" rx="14" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5" filter="url(#soft)"/><rect x="56" y="398" width="536" height="5" rx="2.5" fill="#264C70"/><text class="t lblb" x="76" y="432" style="fill:#264C70" font-size="15">PT. Tangkian Lintas Anugerah</text><text class="t note" x="76" y="452">Cement distribution</text><text class="t cap" x="76" y="476">PENJUALAN</text><circle cx="82" cy="500.5" r="2.6" fill="#264C70"/><text class="t lbl" x="94" y="505">Invoice Penjualan</text><circle cx="82" cy="521.5" r="2.6" fill="#264C70"/><text class="t lbl" x="94" y="526">Surat Jalan</text><circle cx="82" cy="542.5" r="2.6" fill="#264C70"/><text class="t lbl" x="94" y="547">Piutang Dagang</text><text class="t cap" x="76" y="573">PEMBELIAN</text><circle cx="82" cy="597.5" r="2.6" fill="#264C70"/><text class="t lbl" x="94" y="602">Purchase Order</text><circle cx="82" cy="618.5" r="2.6" fill="#264C70"/><text class="t lbl" x="94" y="623">Penerimaan Barang</text><circle cx="82" cy="639.5" r="2.6" fill="#264C70"/><text class="t lbl" x="94" y="644">Hutang Dagang</text><text class="t cap" x="76" y="670">PERSEDIAAN</text><circle cx="82" cy="694.5" r="2.6" fill="#264C70"/><text class="t lbl" x="94" y="699">Kartu Stok</text><circle cx="82" cy="715.5" r="2.6" fill="#264C70"/><text class="t lbl" x="94" y="720">Stock Adjustment</text><circle cx="82" cy="736.5" r="2.6" fill="#264C70"/><text class="t lbl" x="94" y="741">Master Gudang</text><text class="t cap" x="76" y="767">LAPORAN OPERASIONAL</text><circle cx="82" cy="791.5" r="2.6" fill="#264C70"/><text class="t lbl" x="94" y="796">Laporan Penjualan</text><circle cx="82" cy="812.5" r="2.6" fill="#264C70"/><text class="t lbl" x="94" y="817">Laporan PO</text><circle cx="82" cy="833.5" r="2.6" fill="#264C70"/><text class="t lbl" x="94" y="838">Laporan Surat Jalan</text><circle cx="82" cy="854.5" r="2.6" fill="#264C70"/><text class="t lbl" x="94" y="859">Kartu Piutang</text><path class="edge" d="M324.0 340 V358 H560 V394"/><rect x="592" y="398" width="536" height="536" rx="14" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5" filter="url(#soft)"/><rect x="592" y="398" width="536" height="5" rx="2.5" fill="#38A169"/><text class="t lblb" x="612" y="432" style="fill:#38A169" font-size="15">PT. Tangkian Samudera Logistik</text><text class="t note" x="612" y="452">Stevedoring &amp; haulage (PBM)</text><text class="t cap" x="612" y="476">PBM &amp; EKSPEDISI</text><circle cx="618" cy="500.5" r="2.6" fill="#38A169"/><text class="t lbl" x="630" y="505">Job Order (BL, kapal, voyage)</text><circle cx="618" cy="521.5" r="2.6" fill="#38A169"/><text class="t lbl" x="630" y="526">Invoice PBM / Dooring</text><circle cx="618" cy="542.5" r="2.6" fill="#38A169"/><text class="t lbl" x="630" y="547">Piutang Usaha</text><text class="t cap" x="612" y="573">PEMBELIAN</text><circle cx="618" cy="597.5" r="2.6" fill="#38A169"/><text class="t lbl" x="630" y="602">Purchase Order vendor</text><circle cx="618" cy="618.5" r="2.6" fill="#38A169"/><text class="t lbl" x="630" y="623">Vendor / Subkon</text><circle cx="618" cy="639.5" r="2.6" fill="#38A169"/><text class="t lbl" x="630" y="644">Hutang Usaha</text><text class="t cap" x="612" y="670">LAPORAN OPERASIONAL</text><circle cx="618" cy="694.5" r="2.6" fill="#38A169"/><text class="t lbl" x="630" y="699">Laporan Pendapatan</text><circle cx="618" cy="715.5" r="2.6" fill="#38A169"/><text class="t lbl" x="630" y="720">Laporan PO</text><circle cx="618" cy="736.5" r="2.6" fill="#38A169"/><text class="t lbl" x="630" y="741">Kartu Piutang / Kartu Hutang</text><path class="edge" d="M860.0 340 V394"/><rect x="1128" y="398" width="536" height="536" rx="14" fill="#FFFFFF" stroke="#CBD8E6" stroke-width="1.5" filter="url(#soft)"/><rect x="1128" y="398" width="536" height="5" rx="2.5" fill="#E8A020"/><text class="t lblb" x="1148" y="432" style="fill:#E8A020" font-size="15">Arobi</text><text class="t note" x="1148" y="452">Coffee shop</text><text class="t cap" x="1148" y="476">PENJUALAN</text><circle cx="1154" cy="500.5" r="2.6" fill="#E8A020"/><text class="t lbl" x="1166" y="505">Invoice Penjualan (tunai / kredit)</text><circle cx="1154" cy="521.5" r="2.6" fill="#E8A020"/><text class="t lbl" x="1166" y="526">Piutang Usaha</text><text class="t cap" x="1148" y="552">PEMBELIAN</text><circle cx="1154" cy="576.5" r="2.6" fill="#E8A020"/><text class="t lbl" x="1166" y="581">Purchase Order bahan baku</text><circle cx="1154" cy="597.5" r="2.6" fill="#E8A020"/><text class="t lbl" x="1166" y="602">Penerimaan Barang</text><circle cx="1154" cy="618.5" r="2.6" fill="#E8A020"/><text class="t lbl" x="1166" y="623">Hutang Usaha</text><text class="t cap" x="1148" y="649">MASTER</text><circle cx="1154" cy="673.5" r="2.6" fill="#E8A020"/><text class="t lbl" x="1166" y="678">Master Produk / Menu</text><circle cx="1154" cy="694.5" r="2.6" fill="#E8A020"/><text class="t lbl" x="1166" y="699">Master Supplier</text><path class="edge" d="M1396.0 340 V394"/><text class="t cap" x="56" y="986">4 — ACCOUNTING CORE (IDENTICAL IN ALL THREE ENTITIES)</text><rect x="56" y="1002" width="1608" height="116" rx="14" fill="#EEF4FA" stroke="#264C70" stroke-width="1.5"/><rect x="76" y="1026" width="196" height="38" rx="999" fill="#264C70"/><text class="t" x="174.0" y="1049.5" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">Jurnal</text><rect x="284" y="1026" width="196" height="38" rx="999" fill="#264C70"/><text class="t" x="382.0" y="1049.5" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">Buku Besar</text><rect x="492" y="1026" width="196" height="38" rx="999" fill="#264C70"/><text class="t" x="590.0" y="1049.5" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">Neraca Saldo</text><rect x="700" y="1026" width="196" height="38" rx="999" fill="#264C70"/><text class="t" x="798.0" y="1049.5" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">Laba Rugi</text><rect x="908" y="1026" width="196" height="38" rx="999" fill="#264C70"/><text class="t" x="1006.0" y="1049.5" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">Neraca</text><rect x="1116" y="1026" width="196" height="38" rx="999" fill="#264C70"/><text class="t" x="1214.0" y="1049.5" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">Arus Kas</text><rect x="1324" y="1026" width="196" height="38" rx="999" fill="#264C70"/><text class="t" x="1422.0" y="1049.5" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">Key Stats</text><text class="t note" x="76" y="1092">Setup — Chart of Accounts · Master Kas &amp; Bank · Saldo Awal · Periode Akuntansi · Profil Perusahaan · Pengguna · Hak Akses</text><path class="edgeA" d="M324.0 934 V956 H620 V998"/><path class="edgeA" d="M860.0 934 V998"/><path class="edgeA" d="M1396.0 934 V998"/><text class="t cap" x="56" y="1166">5 — GROUP LEVEL (READS ALL THREE ENTITIES)</text><rect x="56" y="1182" width="1608" height="86" rx="14" fill="#1E3F5C"/><text class="t w" x="84" y="1216" font-size="16">Laporan Konsolidasi</text><text class="t ws" x="84" y="1238">PSAK 65 / IFRS 10 — elimination column reserved for inter-company transactions</text><rect x="700" y="1208" width="296" height="34" rx="999" fill="#2F5A83"/><text class="t" x="848.0" y="1229.5" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">Laba Rugi Konsolidasi</text><rect x="1016" y="1208" width="296" height="34" rx="999" fill="#2F5A83"/><text class="t" x="1164.0" y="1229.5" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">Neraca Konsolidasi</text><rect x="1332" y="1208" width="296" height="34" rx="999" fill="#2F5A83"/><text class="t" x="1480.0" y="1229.5" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">Ringkasan Entitas</text><path class="edgeA" d="M860 1118 V1178"/></svg>